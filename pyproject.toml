[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-vulnerability-reporter"
version = "0.1.0"
description = "Read-only vulnerability inventory reporter for Wazuh Indexer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vuln-detect = "vuln_detect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
